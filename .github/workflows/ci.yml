# Integración continua del backend (SIGRA).
# Corre en cada push y en cada pull request hacia develop o main.
#
# Trabajo 1 - pruebas unitarias: compila y ejecuta ./gradlew test (sin base de datos).
# Trabajo 2 - pruebas de integración: levanta PostgreSQL 16, crea el esquema sigra desde
#   docs/db/SIGRA_SCHEMA_CURRENT.sql y ejecuta ./gradlew integrationTest con ddl-auto=validate.
#   Si falta una tabla o columna para alguna entidad, este trabajo falla.
#
# Secretos (opcionales): CI_DB_PASSWORD y CI_JWT_SECRET en Settings > Secrets and variables > Actions.
# Si no existen se usan los valores de respaldo de abajo, que son desechables y viven solo
# durante la corrida (la base de datos de CI se destruye al terminar). No hay credenciales reales.

name: CI

on:
  push:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: SIGRA

jobs:
  pruebas-unitarias:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar y ejecutar las pruebas unitarias
        run: ./gradlew clean test --no-daemon

      - name: Guardar el reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-unitarias
          path: SIGRA/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  pruebas-integracion:
    name: Pruebas de integración (PostgreSQL)
    needs: pruebas-unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_only_password' }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/postgres?currentSchema=sigra
      DB_USERNAME: postgres
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_only_password' }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci_only_jwt_secret_with_at_least_32_chars_x' }}
      JWT_EXPIRATION_MS: '3600000'
      SERVER_PORT: '8080'
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      JPA_DDL_AUTO: validate
      JPA_SHOW_SQL: 'false'
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Crear el esquema sigra en PostgreSQL
        working-directory: ${{ github.workspace }}
        env:
          PGPASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_only_password' }}
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f docs/db/SIGRA_SCHEMA_CURRENT.sql

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Ejecutar las pruebas de integración
        run: ./gradlew integrationTest --no-daemon

      - name: Guardar el reporte de pruebas de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-integracion
          path: SIGRA/build/reports/tests/integrationTest
          if-no-files-found: ignore
          retention-days: 7
